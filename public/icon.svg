<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.6" />

  <!-- Center Cloche / Food Dome Icon -->
  <g filter="url(#glow)">
    <!-- Base Tray -->
    <path d="M112 368 C112 360, 120 352, 128 352 L384 352 C392 352, 400 360, 400 368 L400 376 C400 382, 394 388, 388 388 L124 388 C118 388, 112 382, 112 376 Z" fill="url(#accentGrad)" />
    
    <!-- Dome -->
    <path d="M136 332 C136 220, 210 168, 256 168 C302 168, 376 220, 376 332 Z" fill="#ffffff" />
    
    <!-- Inner Accent Shadow Arc -->
    <path d="M152 332 C152 236, 214 186, 256 186 C298 186, 360 236, 360 332 Z" fill="#f8fafc" />
    
    <!-- Cloche Handle Top -->
    <circle cx="256" cy="144" r="22" fill="url(#goldGrad)" />
    <path d="M250 162 L262 162 L260 172 L252 172 Z" fill="url(#goldGrad)" />

    <!-- Steam Waves -->
    <path d="M220 114 C216 100, 226 90, 222 76" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M256 104 C252 90, 262 80, 258 66" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M292 114 C288 100, 298 90, 294 76" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85" />
  </g>

  <!-- Subtitle badge: ERP -->
  <rect x="206" y="412" width="100" height="34" rx="17" fill="#10b981" />
  <text x="256" y="435" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="3">RESTO</text>
</svg>
